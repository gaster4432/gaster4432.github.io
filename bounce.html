<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An infinite bouncing cat screensaver with adjustable speed, size, and trail. Change the emoji, go wild.">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<title>Bouncing Cat</title>
<meta property="og:title" content="Bouncing Cat">
<meta property="og:description" content="An infinite bouncing cat screensaver with adjustable speed, size, and trail. Change the emoji, go wild.">
<meta property="og:url" content="https://gaster4432.github.io/bounce.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gaster4432.github.io/favicon-v2.ico">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Bouncing Cat">
<meta name="twitter:description" content="An infinite bouncing cat screensaver with adjustable speed, size, and trail. Change the emoji, go wild.">
<meta name="twitter:image" content="https://gaster4432.github.io/favicon-v2.ico">
<link rel="icon" type="image/x-icon" href="/favicon-v2.ico">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0a0a0b;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: none;
}
#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 14px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  z-index: 10;
  opacity: 0;
  transition: opacity 0.3s;
  flex-wrap: wrap;
  justify-content: center;
}
#controls:hover { opacity: 1; }
#controls button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #fff;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
#controls button:hover { background: rgba(255,255,255,0.15); }
#controls input[type="range"] { width: 60px; }
#controls input[type="text"] { width: 36px; text-align:center; background:rgba(255,255,255,0.08); border:none; border-radius:6px; color:#fff; font-size:16px; padding:2px; }
#info {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: 12px;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
  text-align: center;
}
.count-label {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  min-width: 30px;
  text-align: center;
}
@media (max-width: 640px) {
  #controls { max-width: 94%; bottom: 10px; gap: 6px; }
}
</style>
</head>
<body>
<div id="info">move mouse for controls · click to spawn burst · double-click reset · try 🎉 Party</div>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="homeBtn" title="Back to home">⌂</button>
  <button id="toggleBtn">Pause</button>
  <button id="speedDown">−</button>
  <input type="range" id="speedSlider" min="0.5" max="5" step="0.5" value="2">
  <button id="speedUp">+</button>
  <input type="text" id="emojiInput" value="🐱">
  <button id="sizeDown">−</button>
  <input type="range" id="sizeSlider" min="16" max="80" step="2" value="36">
  <button id="sizeUp">+</button>
  <button id="trailToggle">Trail</button>
  <button id="partyBtn" title="Rainbow gravity chaos">🎉 Party</button>
  <button id="soundBtn" title="Toggle boing sounds">🔊</button>
  <button id="resetBtn">Reset</button>
  <span class="count-label" id="countLabel" title="balls">1</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let paused = false;
let showTrail = false;
let party = false;
let soundOn = true;
let emoji = '🐱';
let baseSize = 36;
let bounces = 0;
let bestBounces = parseInt(localStorage.getItem('bounce_best') || '0', 10) || 0;
let boingCtx = null;

let balls = [];
const MAX_BALLS = 150;
const speedSlider = document.getElementById('speedSlider');
const sizeSlider = document.getElementById('sizeSlider');
const countLabel = document.getElementById('countLabel');
let curSpeed = parseFloat(speedSlider.value) * 1.5;

function createBall(x, y, vx, vy, size) {
  return { x, y, vx, vy, size, emoji, hue: party ? Math.floor(Math.random() * 360) : 0 };
}

function boing(size) {
  if (!soundOn) return;
  try {
    boingCtx = boingCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (boingCtx.state === 'suspended') boingCtx.resume();
    const o = boingCtx.createOscillator(), g = boingCtx.createGain();
    o.type = 'triangle';
    const t = boingCtx.currentTime;
    const f = 220 + curSpeed * 70 + (80 - Math.min(80, size)) * 3 + Math.random() * 120;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(60, f * 0.5), t + 0.12);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(boingCtx.destination);
    o.start(t); o.stop(t + 0.15);
  } catch (e) {}
}

function noteBounce() {
  bounces++;
  if (bounces > bestBounces) {
    bestBounces = bounces;
    try { localStorage.setItem('bounce_best', String(bestBounces)); } catch (e) {}
  }
  countLabel.title = bounces + ' bounces · best ' + bestBounces;
}

function spawnBurst(x, y) {
  for (let i = 0; i < 5; i++) {
    if (balls.length >= MAX_BALLS) break;
    const angle = Math.random() * 2 * Math.PI;
    addBall(x, y, Math.cos(angle) * curSpeed * 1.2, Math.sin(angle) * curSpeed * 1.2, baseSize);
  }
  countLabel.textContent = balls.length;
}

function addBall(x, y, vx, vy, size) {
 balls.push(createBall(x, y, vx, vy, size));
}

function initBalls(count) {
  balls = [];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    addBall(
      W / 2 + (Math.random() - 0.5) * 100,
      H / 2 + (Math.random() - 0.5) * 100,
      Math.cos(angle) * curSpeed,
      Math.sin(angle) * curSpeed,
      baseSize
    );
  }
}
initBalls(1);

function update() {
  if (paused) return;
  const newBalls = [];
  for (const b of balls) {
    if (party) b.vy += 0.05;
    b.x += b.vx;
    b.y += b.vy;
    if (party && b.hue != null) b.hue = (b.hue + 2) % 360;
    let hit = false;
    if (b.x - b.size / 2 < 0) { b.x = b.size / 2; b.vx = -b.vx; hit = true; }
    if (b.x + b.size / 2 > W) { b.x = W - b.size / 2; b.vx = -b.vx; hit = true; }
    if (b.y - b.size / 2 < 0) { b.y = b.size / 2; b.vy = -b.vy; hit = true; }
    if (b.y + b.size / 2 > H) { b.y = H - b.size / 2; b.vy = -b.vy; hit = true; }
    if (hit) {
      boing(b.size);
      noteBounce();
      const angle = Math.random() * 2 * Math.PI;
      if (balls.length + newBalls.length < MAX_BALLS) {
        newBalls.push(createBall(b.x, b.y, Math.cos(angle) * curSpeed, Math.sin(angle) * curSpeed, baseSize));
      }
    }
  }
  for (const nb of newBalls) balls.push(nb);
  countLabel.textContent = balls.length;
}

function draw() {
  if (!showTrail) {
    ctx.clearRect(0, 0, W, H);
  } else {
    ctx.fillStyle = 'rgba(10,10,11,0.06)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const b of balls) {
    ctx.font = `${b.size}px sans-serif`;
    if (party && b.hue != null) ctx.filter = `hue-rotate(${b.hue}deg) saturate(1.6)`;
    else ctx.filter = 'none';
    ctx.fillText(b.emoji, b.x, b.y);
  }
  ctx.filter = 'none';
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

// ─── Controls ───
const $ = id => document.getElementById(id);

$('toggleBtn').onclick = () => { paused = !paused; $('toggleBtn').textContent = paused ? 'Play' : 'Pause'; };

function applySpeed() {
  curSpeed = parseFloat(speedSlider.value) * 1.5;
  for (const b of balls) {
    const a = Math.atan2(b.vy, b.vx);
    b.vx = Math.cos(a) * curSpeed;
    b.vy = Math.sin(a) * curSpeed;
  }
}
speedSlider.oninput = applySpeed;
$('speedUp').onclick = () => { speedSlider.value = Math.min(5, parseFloat(speedSlider.value) + 0.5); applySpeed(); };
$('speedDown').onclick = () => { speedSlider.value = Math.max(0.5, parseFloat(speedSlider.value) - 0.5); applySpeed(); };

function applySize() {
  baseSize = parseInt(sizeSlider.value);
  for (const b of balls) b.size = baseSize;
}
sizeSlider.oninput = applySize;
$('sizeUp').onclick = () => { sizeSlider.value = Math.min(80, parseInt(sizeSlider.value) + 2); applySize(); };
$('sizeDown').onclick = () => { sizeSlider.value = Math.max(16, parseInt(sizeSlider.value) - 2); applySize(); };

$('emojiInput').oninput = () => {
  emoji = $('emojiInput').value || '🐱';
  for (const b of balls) b.emoji = emoji;
};

$('trailToggle').onclick = () => {
  showTrail = !showTrail;
  $('trailToggle').textContent = showTrail ? 'Trail ON' : 'Trail';
  if (!showTrail) ctx.clearRect(0, 0, W, H);
};

$('resetBtn').onclick = () => { initBalls(1); bounces = 0; countLabel.title = 'best ' + bestBounces; };
$('homeBtn').onclick = () => { location.href = '/'; };

$('partyBtn').onclick = () => {
  party = !party;
  $('partyBtn').textContent = party ? '🎉 PARTY!' : '🎉 Party';
  if (party && !showTrail) $('trailToggle').click();
  for (const b of balls) if (b.hue == null || b.hue === 0) b.hue = Math.floor(Math.random() * 360);
};

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
};

canvas.addEventListener('pointerdown', (e) => {
  const r = canvas.getBoundingClientRect();
  spawnBurst(e.clientX - r.left, e.clientY - r.top);
});
countLabel.title = 'best ' + bestBounces;

canvas.ondblclick = () => { initBalls(1); bounces = 0; };

// Hide controls
let hideTimer;
function wakeControls() {
  $('controls').style.opacity = '1';
  $('info').style.opacity = '0';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!$('controls').matches(':hover')) $('controls').style.opacity = '0';
  }, 3000);
}
document.onmousemove = wakeControls;
document.addEventListener('touchstart', wakeControls, { passive: true });
</script>
</body>
</html>
