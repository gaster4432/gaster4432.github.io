[package]
name = "peek-inject"
version = "0.1.0"
description = "Peek Remote injector — localhost daemon that injects input via uinput and serves the share page"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = [] }
