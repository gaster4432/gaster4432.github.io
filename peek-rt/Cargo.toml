[package]
name = "peek-rt"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
gstreamer = "0.23"
gstreamer-webrtc = { version = "0.23", features = ["v1_18"] }
ashpd = { version = "0.14", features = ["tokio", "screencast"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[lib]
name = "peek_rt"
path = "src/lib.rs"

[[bin]]
name = "peek-rt-check"
path = "src/bin.rs"

[[bin]]
name = "peek-rt-host"
path = "src/bin_host.rs"
