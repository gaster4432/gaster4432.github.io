[package]
name = "peek-remote"
version = "0.2.3"
description = "Peek Remote — remote screen share + input control over the Peek v4 mailbox"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.2"

# The native GStreamer host path is Linux-only (needs system GStreamer libs).
[target.'cfg(target_os = "linux")'.dependencies]
peek-rt = { path = "../../peek-rt" }
gstreamer = "0.23"
gstreamer-webrtc = { version = "0.23", features = ["v1_18"] }
evdev = { version = "0.13", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
